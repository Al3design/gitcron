schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  GitCron es un cliente Git de escritorio. Renderer en Next.js 15 con `output: 'export'`
  —estático, sin servidor— sobre React 19 y Tailwind 4; proceso principal en Electron 42;
  TypeScript 5.9 en todo. Estado con Zustand, Git con simple-git, GitHub con @octokit/rest,
  y persistencia con `node:sqlite`, el módulo nativo de Node, sin dependencia externa.
  Build: `next build` para el renderer y tsup para el main, empaquetado con electron-builder.
  Pruebas con Vitest.

  Una regla vive en un solo lugar. Si está en este archivo, no se repite en un prompt, en un
  spec ni en un tasks.md. Cuando la misma regla existe en dos lados, tarde o temprano dicen
  cosas distintas y nadie sabe cuál manda. El 2026-09-01 el cierre de una tanda estaba escrito
  acá, en un documento de invariantes y en cada prompt: las tres versiones diferían, y la del
  documento omitía el paso que hacía fallar la suite.

  Nada se cita por número. Se escribe lo que la regla dice, o no se escribe. Una referencia
  como «conforme al invariante 12» deja de significar algo en el momento en que ese documento
  se mueve o se borra, y no hay forma de darse cuenta: nada falla. El mismo día se encontraron
  catorce citas así apuntando al vacío, en changes y en specs consolidadas.

  Rama por cambio. Lo primero al empezar un cambio, antes de escribir ningún artefacto, es
  crear la rama y pararse en ella: `git checkout -b change/<slug>`, con el mismo slug del
  cambio. Si ya existe la rama de este mismo cambio, pararse en ella: es trabajo propio que se
  retoma. Si la que existe es la de otro cambio, informarlo y parar —cambiarse arrastra sus
  commits y eso lo decide una persona—. Crear la rama es parte de abrir el cambio y no algo
  que haya que pedir: es local, reversible y no publica nada. Lo que sí se informa es que se
  creó y con qué nombre. Vale igual si el cambio se crea desde la terminal con `openspec new
  change`: la convención no depende de haber pasado por ninguna pantalla. GitCron lo automatiza
  al proponer un cambio, y si la rama falla no lanza la sesión, porque arrancar en otra sería
  divergencia entre lo declarado y lo ejecutado. Fusionar a `main` y borrar la rama son
  acciones humanas: el ejecutor no fusiona, no borra la rama y no vuelve a `main` por su cuenta.

  Esto NO aplica al trabajo normal: implementar, corregir, refactorizar y revisar no
  requieren consultar nada. Aplica sólo cuando se va a proponer o construir una pieza
  de metodología —un generador de tandas, un auditor, un formato de tareas, un canal
  para pasarle reglas a un ejecutor—. Ahí, antes de escribirla, mirar si OpenSpec ya
  la trae: `openspec --help` y el `--help` del subcomando que corresponda lo dicen en
  un segundo, y responden por la versión instalada en esta máquina. La documentación
  web sólo si el CLI no alcanza. El 2026-09-01 se escribió un change entero para
  construir tres piezas que OpenSpec ya tenía.

operations:
  apply:
    guidance:
      - >-
        Trabajamos en tandas pequeñas con un resultado verificable. El prompt incluye
        objetivo, contexto específico y comprobación; el tamaño depende de la tarea,
        sin un límite fijo de archivos ni equivalencia obligatoria entre casilla y prompt.
        Las rutas orientan el alcance, no prohíben leer dependencias necesarias.
      - >-
        El orquestador prepara el contexto y audita el diff y sus consumidores reales;
        la IA local implementa la tanda. Las decisiones pendientes se explicitan cuando
        cambian el alcance; las correcciones normales dentro del encargo no requieren
        volver a pedir autorización. Las instrucciones actuales del usuario prevalecen
        sobre un prompt histórico: ante contradicciones, identificar la fuente concreta.
      - >-
        Durante la edición usar comprobaciones focalizadas: pnpm verificar --tocados corre
        sólo las pruebas que dependen de los archivos tocados. La IA ejecutora corre también
        la verificación completa (`pnpm verificar`) para cerrar su tanda; antes de fusionar a
        main o de sacar versión se corre `pnpm verificar --todo`, con build y la suite entera
        dos veces. Es obligatorio tener la completa en verde antes del commit y volver a verificar después
        de corregir código. Una tanda corre la completa una vez al cerrar, no después de cada
        paso; si lo último que se tocó son reportes, logs o capturas, no se repite. Una corrida
        larga se lanza y se lee al terminar, sin esperas con temporizador que revisan el log
        una y otra vez. El auditor revisa la correspondencia entre código final, resultados
        y evidencia, y puede hacer pruebas puntuales de segundos para confirmar una sospecha.
        Un arreglo chico que encuentra la auditoría lo hace el auditor directamente, con su
        verificación, en vez de devolverlo al ejecutor: cada vuelta le cuesta al ejecutor
        releer toda la tanda. Lo que es trabajo nuevo vuelve al ejecutor. scripts/verificar.mjs es la fuente del orden
        de las verificaciones y de sus escalones.
        Toda búsqueda con rg lleva la carpeta donde buscar (por ejemplo `rg -n "x" components
        electron lib`, o `.`): sin carpeta, rg lee la entrada estándar y en una terminal no
        interactiva queda esperando para siempre. Medido el 2026-10-01: con carpeta, 0,09 s; sin
        carpeta, colgado hasta cancelarlo. Excluir node_modules no lo arregla.
        Registrar fallos o límites sin convertirlos en éxito ni corregir trabajo ajeno
        fuera del alcance. En tandas sólo documentales, validar los changes afectados
        en modo estricto y revisar el diff.
      - >-
        Las comprobaciones contra modelos de IA reales (servidores de casa, túneles,
        suscripciones por CLI) son cortas y automáticas. Por ejemplo: una petición mínima al
        modelo y ver que sus modelos aparecen en el selector de la pantalla. Tardan segundos y
        se corren cuando la tanda toca algo de IA. Los recorridos largos de varias pantallas
        contra la IA real se corren a pedido, no en cada cierre: dependen de una red y de un
        hardware que no controlamos. Un recorrido funcional (importar, redactar, lanzar, fallar
        y recuperar) se demuestra con pruebas automáticas; no se le pide a Alejandro que
        apriete botones para comprobarlo.
        Alejandro hace las pruebas de experiencia y diseño (UX/UI) todas juntas, en una
        ronda propia, y no tarea por tarea. Lo ya aprobado no se reabre para mejorar su
        evidencia. Si una tanda necesita una segunda corrección, se para y se decide con
        Alejandro si sigue. Entre el 2026-10-08 y el 2026-10-09, la tarea 7.1 de
        modelos-en-casa se estiró a cuatro tandas (29, 29b, 29c y 29d) porque cada auditoría
        pedía más evidencia sobre recorridos que ya funcionaban, y las pruebas contra la IA
        real corrían en cada cierre. Gastaron la cuota del ejecutor sin hacer avanzar el
        producto.
      - >-
        Dejar un reporte breve en tmp/reportes/<change>-<tanda>.md con base Git, alcance,
        archivos modificados, comprobaciones ejecutadas y resultados, ruta del log y
        pendientes. El log del verificador está en tmp/verificacion.log. La auditoría
        contrasta ese reporte con el checkout; marcar tareas sólo por su evidencia.
      - >-
        Esta rutina se mantiene aquí. EXECUTION.md contiene la secuencia del producto;
        los execution.md describen dependencias y referencias por tarea. Propuestas,
        specs, diseños y prompts conservan requisitos específicos, sin copiar estas
        instrucciones ni agregar una rutina general paralela.
